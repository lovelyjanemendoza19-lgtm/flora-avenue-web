<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE -->
    <title>Flora Avenue</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="public/css/style.css">
    <link rel="stylesheet" href="public/css/home.css">
</head>

<body>

    <!-- MENU OVERLAY -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- SIDE MENU -->

    <path
        d="M12 3.25C12.4142 3.25 12.75 3.58579 12.75 4C12.75 4.41421 12.4142 4.75 12 4.75C7.99594 4.75 4.75 7.99594 4.75 12C4.75 16.0041 7.99594 19.25 12 19.25C12.4142 19.25 12.75 19.5858 12.75 20C12.75 20.4142 12.4142 20.75 12 20.75C7.16751 20.75 3.25 16.8325 3.25 12C3.25 7.16751 7.16751 3.25 12 3.25Z"
        fill="currentColor">
    </path>

    <path
        d="M16.4697 9.53033C16.1768 9.23744 16.1768 8.76256 16.4697 8.46967C16.7626 8.17678 17.2374 8.17678 17.5303 8.46967L20.5303 11.4697C20.8232 11.7626 20.8232 12.2374 20.5303 12.5303L17.5303 15.5303C17.2374 15.8232 16.7626 15.8232 16.4697 15.5303C16.1768 15.2374 16.1768 14.7626 16.4697 14.4697L18.1893 12.75H10C9.58579 12.75 9.25 12.4142 9.25 12C9.25 11.5858 9.58579 11.25 10 11.25H18.1893L16.4697 9.53033Z"
        fill="currentColor">
    </path>

    </svg>

    </span>

    <span class="menu-text">Log Out</span>
    </a>

    </nav>

    </aside>

    <!-- WEBSITE -->
    <div class="website">

        <!-- HEADER -->
        <header>

            <button class="menu-button" id="menuButton">
                ☰
            </button>

            <div class="logo">
                <img src="public/images/logo.png" alt="Flora Avenue Logo">
            </div>

        </header>

        <main>

            <!-- BANNER -->
            <section class="banner">

                <div class="banner-text">

                    <p class="banner-small-text">
                        FLORA AVENUE
                    </p>

                    <h1>
                        Handmade Crafts
                        <br>
                        for Every Moment
                    </h1>

                    <p>
                        We offer handmade bouquets,
                        printing crafts,
                        keychain charms,
                        and souvenirs.
                    </p>

                    <a href="pages/products/products.html">
                        Browse Products
                    </a>

                </div>

            </section>

            <!-- FEATURED PRODUCTS -->
            <section class="featured">

                <div class="featured-heading">

                    <h1>
                        Featured Product
                    </h1>

                    <a href="pages/products/products.html">
                        See All
                    </a>

                </div>

                <div class="product-list"></div>

            </section>

        </main>

    </div>

    <script src="pages/products/products-data.js"></script>
    <script>
        const featuredProductIds = [
            "satin-rose",
            "eternal-rose",
            "sunflower",
            "dahlia"
        ];

        const productList = document.querySelector(".product-list");

        featuredProductIds.forEach(function (productId) {
            const product = window.products[productId];

            if (!product) {
                return;
            }

            const lowestPrice = Math.min.apply(
                null,
                product.variations.map(function (variation) {
                    return variation.price;
                })
            );

            const card = document.createElement("a");
            card.className = "product-card";
            card.href =
                "pages/products/product-details.html?id=" + product.id;
            card.innerHTML = `
                <img src="${product.image.replace("../../", "")}" alt="${product.name}">
                <div class="product-text">
                    <p>${product.name}</p>
                    <span>${lowestPrice ? "From ₱" + lowestPrice.toLocaleString() : "Custom Price"}</span>
                </div>
            `;
            productList.appendChild(card);
        });
    </script>
    <script src="public/js/script.js"></script>

</body>

</html>
