<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE -->
    <title>Flora Avenue</title>
    <!-- END TITLE -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="public/css/style.css">
    <link rel="stylesheet" href="public/css/home.css">
</head>

    <!-- WEBSITE -->
<body data-navigation-base="">

    <div class="website">
        <!-- HEADER -->
        <header>

            <button class="menu-button" id="menuButton">
                ☰
            </button>

            <div class="logo">
                <img src="public/images/logo.png"
                   alt="Flora Avenue Logo">
            </div>
    
            <script src="public/js/navigation.js"></script>
            <script src="public/js/script.js"></script>
            
        </header>
    
    
        <main>

            <!-- BANNER -->
            <section class="banner">

                <div class="banner-text">

                    <p class="banner-small-text">
                        FLORA AVENUE
                    </p>

                    <h1>
                        Handmade Crafts
                        <br>
                        for Every Moment
                    </h1>

                    <p>
                        We offer handmade bouquets,
                        printing crafts,
                        keychain charms,
                        and souvenirs.
                    </p>

                    <a href="pages/products/products.html">
                        Browse Products
                    </a>

                </div>

            </section>

            <!-- FEATURED PRODUCTS -->
            <section class="featured">

                <div class="featured-heading">

                    <h1>
                        Featured Product
                    </h1>

                    <a href="pages/products/products.html">
                        See All
                    </a>

                </div>

                <div class="product-list"></div>

            </section>

        </main>

    </div>

    <script src="pages/products/products-data.js"></script>
    <script>
        const featuredProductIds = [
            "satin-rose",
            "eternal-rose",
            "sunflower",
            "dahlia",
            "makeup-bouquet",
            "money-bouquet"
        ];

        const productList = document.querySelector(".product-list");

        featuredProductIds.forEach(function (productId) {
            const product = window.products[productId];

            if (!product) {
                return;
            }

            const lowestPrice = Math.min.apply(
                null,
                product.variations.map(function (variation) {
                    return variation.price;
                })
            );

            const card = document.createElement("a");
            card.className = "product-card";
            card.href =
                "pages/products/product-details.html?id=" + product.id;
            card.innerHTML = `
                <img src="${product.image.replace("../../", "")}" alt="${product.name}">
                <div class="product-text">
                    <p>${product.name}</p>
                    <span>${lowestPrice ? "From ₱" + lowestPrice.toLocaleString() : "Custom Price"}</span>
                </div>
            `;
            productList.appendChild(card);
        });
    </script>
    <script src="public/js/script.js"></script>

</body>

</html>
