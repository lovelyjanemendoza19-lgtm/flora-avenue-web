<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Flora Avenue</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="product-details">

        <!-- HEADER -->
        <div class="product-header">

            <a href="products.html" class="back-button">
                ← 
            </a>

            <h1>Product Details</h1>

        </div>


        <!-- PRODUCT CONTENT -->
        <div class="product-content">


            <!-- LEFT SIDE -->
            <div class="product-image-box">

                <img
                    id="productImage"
                    src="images/no-image.png"
                    alt="Product"
                >

            </div>


            <!-- RIGHT SIDE -->
            <div class="product-info">

                <h2 id="productName">
                    Product Name
                </h2>


                <p id="productDescription" class="product-description">
                    Product description
                </p>


                <!-- VARIATION -->
                <div class="option-group" id="variationGroup">

                    <label for="variationSelect">
                        Choose Option
                    </label>

                    <select id="variationSelect">
                    </select>

                </div>


                <!-- COLOR -->
                <div class="option-group" id="colorGroup">

                    <label for="colorSelect">
                        Choose Color
                    </label>

                    <select id="colorSelect">
                    </select>

                </div>


                <!-- PRICE -->
                <div class="product-price">

                    <span>Price</span>

                    <h2 id="productPrice">
                        ₱0
                    </h2>

                </div>


                <!-- ADD ONS -->
                <div class="addons">

                    <h3>Add-Ons</h3>

                    <label>
                        <input type="checkbox" value="5">
                        Butterfly + ₱5
                    </label>

                    <label>
                        <input type="checkbox" value="80">
                        Crown + ₱80
                    </label>

                    <label>
                        <input type="checkbox" value="20">
                        Fairy Lights + ₱20
                    </label>

                    <label>
                        <input type="checkbox" value="10">
                        Printed Message Card + ₱10
                    </label>

                </div>


                <!-- TOTAL -->
                <div class="total-price">

                    <span>Total</span>

                    <strong id="totalPrice">
                        ₱0
                    </strong>

                </div>


                <!-- BUTTONS -->
                <div class="product-actions">

                    <button class="inquire-button">
                        Inquire
                    </button>

                    <button class="order-button">
                        Order
                    </button>

                </div>

            </div>

        </div>

    </main>


    <script src="js/product-details.js"></script>

</body>

</html>
