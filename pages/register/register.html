<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register | Flora Avenue</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">


    <!-- Auth CSS -->

    <link
        rel="stylesheet"
        href="../../public/css/auth.css">

</head>


<body>

    <div class="auth-container">


        <!-- LEFT BRAND -->

        <section class="auth-brand">

            <div class="brand-content">

                <div class="brand-logo">

                    <img
                        src="../../public/images/logo.png"
                        alt="Flora Avenue Logo">

                </div>


                <p class="brand-small">
                    JOIN US
                </p>


                <h1>
                    Create Your
                    <span>Flora Avenue</span>
                    Account
                </h1>


                <p class="brand-description">
                    Create an account and discover
                    handmade crafts made for every moment.
                </p>

            </div>

        </section>


        <!-- REGISTER SECTION -->

        <section class="auth-card-wrapper">

            <div class="mobile-brand">

                <img
                    src="../../public/images/logo.png"
                    alt="Flora Avenue Logo">

            </div>


            <div class="auth-card">

                <div class="auth-heading">

                    <p class="form-label">
                        NEW ACCOUNT
                    </p>

                    <h2>
                        Register
                    </h2>

                    <p>
                        Create your Flora Avenue account.
                    </p>

                </div>


                <!-- REGISTER FORM -->

                <form id="registerForm">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>


                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required>


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="registerPassword">

                                Show

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>


                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required>


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword">

                                Show

                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        <span>
                            I agree to the
                            <a href="#">
                                Terms and Conditions
                            </a>
                        </span>

                    </label>


                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="auth-button">

                        Create Account

                    </button>


                </form>


                <!-- LOGIN -->

                <div class="auth-switch">

                    <span>
                        Already have an account?
                    </span>

                    <a href="../login/login.html">
                        Login here
                    </a>

                </div>


                <!-- HOME -->

                <a
                    href="../../index.html"
                    class="back-home">

                    ← Back to Home

                </a>

            </div>

        </section>


        <!-- Decorative flowers -->

        <div class="floating-flower flower-one">
            ✿
        </div>

        <div class="floating-flower flower-two">
            ❀
        </div>

        <div class="floating-flower flower-three">
            ✿
        </div>


    </div>


    <!-- Auth JS -->

    <script src="../../public/js/auth.js"></script>

</body>

</html>
