<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Flora Avenue</title>


    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- AUTH CSS -->

    <link
        rel="stylesheet"
        href="../../public/css/auth.css"
    >

</head>


<body class="auth-page">


    <!-- DECORATIVE FLOWERS -->

    <div class="floating-flower flower-one">✿</div>
    <div class="floating-flower flower-two">✿</div>
    <div class="floating-flower flower-three">❀</div>
    <div class="floating-flower flower-four">✿</div>


    <main class="auth-container">


        <!-- LEFT BRAND -->

        <section class="auth-brand">

            <div class="brand-content">

                <div class="logo-circle">
                    🌷
                </div>

                <h1>
                    Flora Avenue
                </h1>

                <p class="brand-tagline">
                    Handmade crafts for every moment.
                </p>

                <p class="brand-description">
                    Create your account and start discovering
                    our beautiful handmade creations.
                </p>

                <div class="flower-decoration">
                    ✿　❀　✿
                </div>

            </div>

        </section>



        <!-- REGISTER CARD -->

        <section class="auth-card-wrapper">

            <div class="auth-card register-card">


                <!-- MOBILE BRAND -->

                <div class="mobile-brand">

                    <div class="mobile-logo">
                        🌷
                    </div>

                    <h1>
                        Flora Avenue
                    </h1>

                </div>



                <!-- TITLE -->

                <div class="auth-heading">

                    <span class="welcome">
                        Join us
                    </span>

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Sign up to get started with Flora Avenue.
                    </p>

                </div>



                <!-- REGISTER FORM -->

                <form
                    id="registerForm"
                    class="auth-form"
                >


                    <!-- FULL NAME -->

                    <div class="input-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                👤
                            </span>

                            <input
                                type="text"
                                id="registerName"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>



                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉
                            </span>

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('registerPassword', this)"
                            >
                                👁
                            </button>

                        </div>

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('confirmPassword', this)"
                            >
                                👁
                            </button>

                        </div>

                    </div>



                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">
                                Terms and Conditions
                            </a>
                        </span>

                    </label>



                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="auth-button"
                    >

                        <span>
                            Create Account
                        </span>

                        <span class="button-arrow">
                            →
                        </span>

                    </button>


                </form>



                <!-- LOGIN -->

                <div class="auth-switch">

                    <span>
                        Already have an account?
                    </span>

                    <a href="../login/login.html">
                        Sign in
                    </a>

                </div>



                <!-- HOME -->

                <a
                    href="../../index.html"
                    class="back-home"
                >
                    ← Back to Home
                </a>


            </div>

        </section>

    </main>


    <script src="../../public/js/auth.js"></script>

</body>

</html>
