<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Inquiry Details | Flora Avenue Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../public/css/admin.css">
  <link rel="stylesheet" href="../../public/css/admin-figma.css">
  <style>
    .inquiry-admin-card { padding: 18px; margin-bottom: 12px; }
    .inquiry-admin-card .figma-title { margin: 8px 0; }
    .inquiry-admin-meta { margin: 5px 0; }
    .inquiry-admin-section-title { font-family: Poppins, sans-serif; font-size: 14px; }
    .inquiry-admin-message { margin: 10px 0 0; color: #5d5557; line-height: 1.6; white-space: pre-wrap; }
    .inquiry-response-feedback { min-height: 1.5em; margin-top: 10px; }
    .inquiry-done-button { width: auto; min-width: 140px; margin: 12px 0 0; border: 1px solid #c88491; background: #fff; color: #7c4a4f; }
    .inquiry-done-button:hover { border-color: #a95f70; background: #fff; color: #633a3e; }
    .inquiry-done-button[hidden] { display: none; }
    .admin-conversation-thread { display: grid; gap: 10px; max-height: 420px; overflow-y: auto; margin-top: 12px; }
    .admin-conversation-message { max-width: min(88%, 680px); padding: 12px 14px; border: 1px solid #e5d9db; border-radius: 12px; background: #fff; }
    .admin-conversation-message.from-customer { justify-self: start; }
    .admin-conversation-message.from-seller { justify-self: end; border-color: #d9bcc2; background: #f3e8ea; }
    .admin-conversation-message header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; color: #7c4a4f; font-size: 11px; }
    .admin-conversation-message time { color: #756c6f; }
    .admin-conversation-message p { margin: 0; color: #332d2f; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    .admin-reply-label { display: block; margin: 14px 0 6px; color: #756c6f; font-size: 12px; }
    .admin-reply-row { display: flex; align-items: center; gap: 10px; }
    .admin-reply-row #adminReplyMessage { width: 100%; flex: 1 1 auto; min-width: 0; }
    .admin-reply-row #sendResponse { width: auto; min-width: 100px; min-height: 42px; flex: 0 0 auto; margin: 0; padding: 0 14px; font-size: 11px; white-space: nowrap; }
    .admin-reply-textarea { height: 38px; min-height: 38px; max-height: 38px; margin-top: 0; padding: 8px 11px; font-size: 12px; line-height: 20px; resize: none; overflow-x: auto; overflow-y: hidden; white-space: pre; }
    .admin-reply-button:disabled { opacity: .6; cursor: not-allowed; }
    @media (max-width: 600px) {
      .admin-conversation-message { max-width: 96%; }
      .admin-reply-row { gap: 7px; }
      .admin-reply-row .admin-reply-button { min-width: 94px; padding-right: 10px; padding-left: 10px; }
    }
  </style>
</head>
<body class="admin-app">
  <main class="admin-shell">
    <aside class="admin-sidebar-fx">
      <a class="fx-side-brand" href="dashboard.html">
        <img src="../../public/images/logo.png" alt="Flora Avenue">
        <span><strong>Flora Avenue</strong><small>Admin Portal</small></span>
      </a>
      <div class="fx-side-label">Management</div>
      <nav class="fx-side-nav" aria-label="Admin navigation">
        <a href="dashboard.html"><span class="fx-side-icon">▦</span><span>Dashboard</span></a>
        <a href="products.html"><span class="fx-side-icon">▤</span><span>Products</span></a>
        <a href="inquiries.html"><span class="fx-side-icon">✉</span><span>Inquiries</span></a>
        <a href="orders.html"><span class="fx-side-icon">▣</span><span>Orders</span></a>
        <a href="profile.html"><span class="fx-side-icon">♙</span><span>Profile</span></a>
      </nav>
      <div class="fx-side-bottom">
        <div class="fx-side-admin"><div class="fx-side-avatar">♙</div><div><strong>Juan Dela Cruz</strong><small>Administrator</small></div></div>
        <button class="fx-side-logout" id="fxLogoutButton" type="button"><span class="fx-side-icon">↪</span><span>Log Out</span></button>
      </div>
    </aside>
    <header class="admin-topbar">
      <a class="figma-back" href="inquiries.html" aria-label="Back to inquiries">←</a>
      <div class="admin-topbar-title"><h1>Inquiry Details/Response</h1></div>
    </header>
    <div class="figma-page">
      <article class="figma-card inquiry-admin-card">
        <span class="figma-status" id="adminInquiryStatus"></span>
        <h2 class="figma-title" id="adminInquiryTitle">Loading inquiry…</h2>
        <p class="figma-muted inquiry-admin-meta" id="adminInquiryCustomer"></p>
        <p class="figma-muted inquiry-admin-meta" id="adminInquiryReceived"></p>
        <p class="figma-muted inquiry-admin-meta" id="adminInquiryProduct"></p>
      </article>
      <section class="figma-card inquiry-admin-card">
        <h2 class="figma-title inquiry-admin-section-title">Conversation</h2>
        <div class="admin-conversation-thread" id="adminConversation" aria-live="polite"></div>
        <label class="admin-reply-label" for="adminReplyMessage">Your reply</label>
        <div class="admin-reply-row">
          <textarea class="figma-textarea admin-reply-textarea" id="adminReplyMessage" rows="1" placeholder="Type your reply..." aria-label="Your reply"></textarea>
          <button class="figma-btn admin-reply-button" id="sendResponse" type="button">Send Reply</button>
        </div>
      </section>
      <button class="figma-btn inquiry-done-button" id="markInquiryDone" type="button">Mark as Done</button>
      <p class="figma-muted inquiry-response-feedback" id="inquiryResponseFeedback" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script src="../../public/js/inquiry-store.js"></script>
  <script src="../../public/js/admin.js"></script>
  <script src="../../public/js/admin-inquiry-details.js"></script>
</body>
</html>
