<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Order Details | Flora Avenue Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../public/css/admin.css">
  <link rel="stylesheet" href="../../public/css/admin-figma.css">
  <link rel="stylesheet" href="../../public/css/admin-orders.css">
</head>
<body class="admin-app">
  <main class="admin-shell">
    <aside class="admin-sidebar-fx">
      <a class="fx-side-brand" href="dashboard.html">
        <img src="../../public/images/logo.png" alt="Flora Avenue">
        <span><strong>Flora Avenue</strong><small>Admin Portal</small></span>
      </a>
      <div class="fx-side-label">Management</div>
      <nav class="fx-side-nav" aria-label="Admin navigation">
        <a href="dashboard.html"><span class="fx-side-icon">▦</span><span>Dashboard</span></a>
        <a href="products.html"><span class="fx-side-icon">▤</span><span>Products</span></a>
        <a href="inquiries.html"><span class="fx-side-icon">✉</span><span>Inquiries</span></a>
        <a class="active" href="orders.html"><span class="fx-side-icon">▣</span><span>Orders</span></a>
        <a href="profile.html"><span class="fx-side-icon">♙</span><span>Profile</span></a>
      </nav>
      <div class="fx-side-bottom">
        <div class="fx-side-admin"><div class="fx-side-avatar">♙</div><div><strong>Juan Dela Cruz</strong><small>Administrator</small></div></div>
        <button class="fx-side-logout" id="fxLogoutButton" type="button"><span class="fx-side-icon">↪</span><span>Log Out</span></button>
      </div>
    </aside>
    <header class="admin-topbar">
      <a class="figma-back" href="orders.html" aria-label="Back to orders">←</a>
      <div class="admin-topbar-title"><h1>Customer Order</h1></div>
    </header>
    <div class="figma-page">
      <article class="order-admin-detail" id="adminOrderDetails" aria-live="polite">
        <p class="figma-muted">Loading order…</p>
      </article>
    </div>
  </main>
  <script src="../../public/js/customer-order-store.js"></script>
  <script src="../../public/js/admin.js"></script>
  <script src="../../public/js/admin-orders.js"></script>
</body>
</html>
