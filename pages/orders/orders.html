<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Orders | Flora Avenue</title>
	<link rel="stylesheet" href="../../public/css/style.css">
	<link rel="stylesheet" href="../../public/css/orders.css">
</head>
<body class="persistent-sidebar orders-body" data-navigation-base="../../">
	<div class="website">
			<div class="mobile-header">

				<button class="menu-button" id="menuButton">
					☰
				</button>

			</div> 

		<main class="orders-page">

			<h1 class="desktop-title">My Orders</h1>

			<div class="filters" id="orderFilters" role="tablist" aria-label="Filter orders">
				<button class="filter-button active" type="button" role="tab" aria-selected="true" data-filter="all">All</button>
				<button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="to-pay">To Pay</button>
				<button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="to-receive">To Receive</button>
				<button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="completed">Completed</button>
			</div>

			<div class="order-list" id="orderList"></div>

		</main>

	</div>
	<script src="../../public/js/navigation.js"></script>
	<script src="../../public/js/script.js"></script>
	<script src="../../public/js/customer-order-store.js"></script>
	<script src="../../public/js/orders.js"></script>
</body>
</html>
