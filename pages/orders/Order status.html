<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Status | Flora Avenue</title>

    <link rel="stylesheet" href="order-status.css">
</head>

<body>

    <main class="status-page">

        <!-- Back Button -->
        <a href="orders.html" class="back-button">←</a>

        <!-- Status Card -->
        <section class="status-card">

            <!-- Order Placed -->
            <div class="status-item completed">
                <div class="status-icon">✓</div>
                <div class="status-line"></div>

                <div class="status-content">
                    <h2>ORDER PLACED</h2>
                    <p>Oct 24, 2026</p>
                    <p>10:30 AM</p>
                </div>
            </div>


            <!-- Confirmed -->
            <div class="status-item completed">
                <div class="status-icon">✓</div>
                <div class="status-line"></div>

                <div class="status-content">
                    <h2>CONFIRMED</h2>
                    <p>Oct 24, 2026</p>
                    <p>10:15 AM</p>
                </div>
            </div>


            <!-- Processing -->
            <div class="status-item active">
                <div class="status-icon"></div>
                <div class="status-line"></div>

                <div class="status-content">
                    <h2>PROCESSING</h2>
                    <p>Your order is being handcrafted.</p>
                </div>
            </div>


            <!-- Ready for Pickup -->
            <div class="status-item">
                <div class="status-icon"></div>
                <div class="status-line"></div>

                <div class="status-content">
                    <h2>READY FOR PICKUP</h2>
                    <p>Pending</p>
                </div>
            </div>


            <!-- Completed -->
            <div class="status-item last">
                <div class="status-icon"></div>

                <div class="status-content">
                    <h2>COMPLETED</h2>
                    <p>Pending</p>
                </div>
            </div>

        </section>


        <!-- Continue -->
        <a href="orders.html" class="continue-button">
            Continue
        </a>

    </main>

</body>
</html>
