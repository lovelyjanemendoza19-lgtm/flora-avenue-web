<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Flora Avenue</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">


    <!-- Auth CSS -->

    <link
        rel="stylesheet"
        href="../../public/css/auth.css">

</head>


<body>

    <div class="auth-container">


        <!-- LEFT BRAND SECTION -->

        <section class="auth-brand">

            <div class="brand-content">

                <div class="brand-logo">

                    <img
                        src="../../public/images/logo.png"
                        alt="Flora Avenue Logo">

                </div>


                <p class="brand-small">
                    WELCOME BACK
                </p>


                <h1>
                    Welcome Back to
                    <span>Flora Avenue</span>
                </h1>


                <p class="brand-description">
                    Sign in to continue exploring our
                    handmade crafts and beautiful creations.
                </p>

            </div>

        </section>


        <!-- RIGHT LOGIN SECTION -->

        <section class="auth-card-wrapper">

            <div class="mobile-brand">

                <img
                    src="../../public/images/logo.png"
                    alt="Flora Avenue Logo">

            </div>


            <div class="auth-card">

                <div class="auth-heading">

                    <p class="form-label">
                        ACCOUNT
                    </p>

                    <h2>
                        Login
                    </h2>

                    <p>
                        Enter your details to continue.
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>


                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>


                            <button
                                type="button"
                                class="password-toggle"
                                data-target="loginPassword">

                                Show

                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="form-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe">

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a
                            href="#"
                            class="forgot-password">

                            Forgot password?

                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="auth-button">

                        Login

                    </button>


                </form>


                <!-- REGISTER -->

                <div class="auth-switch">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="../register/register.html">
                        Create one
                    </a>

                </div>


                <!-- HOME -->

                <a
                    href="../../index.html"
                    class="back-home">

                    ← Back to Home

                </a>

            </div>

        </section>


        <!-- Decorative flowers -->

        <div class="floating-flower flower-one">
            ✿
        </div>

        <div class="floating-flower flower-two">
            ❀
        </div>

        <div class="floating-flower flower-three">
            ✿
        </div>


    </div>


    <!-- Auth JS -->

    <script src="../../public/js/auth.js"></script>

</body>

</html>
