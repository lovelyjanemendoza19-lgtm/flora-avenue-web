<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Completed | Flora Avenue</title>
  <link rel="stylesheet" href="../../public/css/Order completed.css">
</head>
<body>
  <main class="completion-page">
    <section class="completion-card">
      <div class="completion-check" aria-hidden="true">✓</div>
      <h1>Order Received</h1>
      <p class="completion-message">Your order has been received.</p>
      <p class="reference-label">Order Reference</p>
      <strong id="orderReference" class="order-reference"></strong>
      <img id="productImage" class="product-image" alt="">
      <p class="upload-message">Your order is now Pending seller acceptance. Payment will be available in Order Details after confirmation.</p>
      <div class="completion-actions">
        <a class="orders-link primary-link" id="detailsLink" href="orders.html">View Order Details</a>
        <a class="orders-link secondary-link" href="orders.html">Back to Orders</a>
      </div>
    </section>
  </main>
  <script src="../../public/js/Order completed.js"></script>
</body>
</html>
