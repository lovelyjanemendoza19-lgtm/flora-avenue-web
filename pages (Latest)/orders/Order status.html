<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details | Flora Avenue</title>

    <link rel="stylesheet" href="../../public/css/Order status.css">
</head>

<body>

    <main class="status-page">

        <!-- Back Button -->
        <a href="orders.html" class="back-button">← Back to Orders</a>

        <!-- Status Card -->
        <section class="status-card">
            <p class="detail-label">Order reference</p>
            <h1 id="orderReference"></h1>
            <div id="orderSummary" class="order-summary"></div>
            <p class="current-status">Status: <strong id="currentStatus"></strong></p>
            <div id="sellerActions" class="seller-actions">
                <p>Seller proposal</p>
                <button type="button" id="acceptOrder" class="continue-button">Accept</button>
                <button type="button" id="cancelOrder" class="cancel-button">Cancel</button>
            </div>
            <section id="paymentInfo" class="payment-info" hidden>
                <h2>Payment information</h2>
                <p>Your order is confirmed. Please send the down payment proof through the seller's payment channel.</p>
                <p><strong>Payment method:</strong> Down payment</p>
            </section>
        </section>


        <!-- Continue -->
        <a href="orders.html" class="continue-button">
            Continue
        </a>

    </main>
    <script src="../../public/js/order-details.js"></script>
</body>
</html>
