<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Form | Flora Avenue</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../public/css/order form.css">
</head>
<body>
<div class="wrap">
  <header>
    <p>Product details summary</p>
  </header>

  <form id="orderForm">
    <fieldset>
      <div class="summary-heading">
        <a class="back-button" id="backToProduct" href="../products/product-details.html" aria-label="Back to product details">←</a>
        <h1>Product Details Summary</h1>
      </div>
      <div class="bouquet-recap" id="bouquetRecap">
        <!-- Selected product details are summarized here. -->
      </div>
    </fieldset>

    <fieldset class="customer-details">
      <legend>Customer and fulfillment details</legend>
      <div class="row">
        <div class="field">
          <label for="contactName">Contact name <span class="required">*</span></label>
          <input id="contactName" name="contactName" type="text" required autocomplete="name">
        </div>
        <div class="field">
          <label for="contactNumber">Contact number <span class="required">*</span></label>
          <input id="contactNumber" name="contactNumber" type="tel" required autocomplete="tel">
        </div>
      </div>
      <div class="field">
        <label for="contactEmail">Email address</label>
        <input id="contactEmail" name="contactEmail" type="email" autocomplete="email">
      </div>
      <div class="row">
        <div class="field">
          <label for="fulfil">Method <span class="required">*</span></label>
          <select id="fulfil" name="fulfil" required>
            <option value="">Select one</option>
            <option value="Pickup">Pickup</option>
            <option value="Delivery">Delivery</option>
          </select>
        </div>
        <div class="field">
          <label for="date">Needed by date <span class="required">*</span></label>
          <input id="date" name="date" type="date" required>
        </div>
      </div>
      <div class="field">
        <label for="address">Delivery address</label>
        <input id="address" name="address" type="text" autocomplete="street-address">
      </div>
      <div class="field">
        <label for="orderNotes">Instructions / Notes</label>
        <textarea id="orderNotes" name="orderNotes" maxlength="500" placeholder="Add delivery or pickup instructions."></textarea>
      </div>
      <p id="formError" class="hint" role="alert" aria-live="polite"></p>
    </fieldset>

    <button type="submit" class="submit">Place Order</button>
  </form>
</div>

<script src="../../public/js/order form.js"></script>
</body>
</html>
