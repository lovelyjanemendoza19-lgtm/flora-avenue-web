<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customization Request | Flora Avenue</title>
  <link rel="stylesheet" href="../../public/css/order form.css">
</head>
<body>
  <div class="wrap">
    <header><p>Tell us how you would like your custom creation designed.</p></header>
    <form id="customizationForm">
      <fieldset>
        <div class="summary-heading"><a class="back-button" id="backToProduct" href="products.html" aria-label="Back to product details">←</a><h1>Customization Request</h1></div>
        <div class="bouquet-recap" id="customProduct"></div>
      </fieldset>
      <fieldset>
        <legend>Your Request</legend>
        <div class="field"><label for="design">Preferred Design <span class="required">*</span></label><input id="design" required></div>
        <div class="row"><div class="field"><label for="color">Color <span class="required">*</span></label><input id="color" required></div><div class="field"><label for="items">Number of Stems/Items <span class="required">*</span></label><input id="items" required></div></div>
        <div class="row"><div class="field"><label for="budget">Budget</label><div class="money-input"><span aria-hidden="true">₱</span><input id="budget" type="text" inputmode="decimal" pattern="[0-9]*([.][0-9]{1,2})?" placeholder="0.00"></div></div><div class="field"><label for="occasion">Occasion</label><input id="occasion"></div></div>
        <div class="field"><label for="addons">Add-ons</label><input id="addons"></div>
        <div class="field"><label for="notes">Additional Requests</label><textarea id="notes" rows="4"></textarea></div>
        <div class="field"><label for="reference">Reference/Inspiration Image</label><input id="reference" type="file" accept="image/*"></div>
      </fieldset>
      <button class="submit" type="submit">Submit Request</button>
      <p id="customStatus" class="upload-status" role="status"></p>
      <a id="ordersLink" class="submit" href="../orders/orders.html" hidden>View My Orders</a>
    </form>
  </div>
  <script src="../../public/js/customization.js"></script>
</body>
</html>
